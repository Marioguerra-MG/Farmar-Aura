<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farmar Aura</title>

    <meta name="theme-color" content="#6200ea">

    <meta name="mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="apple-mobile-web-app-title" content="Farmar Aura">

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <header>

            <h1>Farmar Aura</h1>

            <p>Aumente sua energia</p>


        </header>

        <main id="app">

            <!-- TELA -->

            <section id="setup-screen" class="screen">

                <!-- AURA -->

                <div class="aura-display">

                    <div class="aura-circle" id="user-aura-visual"></div>

                </div>

                <hr>

                <!-- INPUT -->

                <div class="input-group">

                    <label for="friend-code" id="grupoConvidr">

                        Aura do Amigo

                            <button id="share-app-btn" class="whatsapp-btn">
                                📲 Convidar amigos
                            </button>
                    </label>

                    <input type="text" id="friend-code" placeholder="Ex: AURA-ABC123-999">

                    <button id="btn-match" class="btn-primary">

                        Aumentar Aura

                    </button>

                </div>

            </section>

        </main>

    </div>

    <!-- ========================= -->
    <!-- JS SEPARADOS -->
    <!-- ========================= -->

    <script src="js/elements.js"></script>

    <script src="js/storage.js"></script>

    <script src="js/aura.js"></script>

    <script src="js/ui.js"></script>

    <script src="js/card.js"></script>

    <script src="js/game.js"></script>
    <!--
    <script src="js/tests.js"></script>
    -->
    <script src="js/instagram.js"></script>

    <script src="js/app.js"></script>

    <!-- ========================= -->
    <!-- SERVICE WORKER -->
    <!-- ========================= -->

    <script>

        if ('serviceWorker' in navigator) {

            navigator
                .serviceWorker
                .register('sw.js');
        }

    </script>

</body>

</html>
