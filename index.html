<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmar Aura</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6200ea">
</head>

<body>
    <div class="container">
        <header>
            <h1>Farmar Aura</h1>
            <p>Aumente sua energia</p>
        </header>

        <main id="app">
            <!-- Tela Inicial -->
            <section id="setup-screen" class="screen">
                <div class="aura-display">
                    <div class="aura-circle" id="user-aura-visual"></div>
                </div>

                <hr>

                <div class="input-group">
                    <label for="friend-code">Aura do Amigo:</label>
                    <input type="text" id="friend-code" placeholder="Ex: AURA-1234">
                    <button id="btn-match" class="btn-primary">Aumenta aura</button>
                </div>
            </section>

    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>

</html>
