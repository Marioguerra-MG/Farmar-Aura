<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmar Aura ⚡</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0e12">
</head>
<body>

    <div class="app-container">
        <header>
            <h1>⚡ FARMAR AURA</h1>
            <p class="subtitle">Absorva a energia dos seus amigos e alcance o nível Supremo.</p>
        </header>

        <!-- CÍRCULO CENTRAL DA AURA -->
        <div class="aura-wrapper">
            <div id="aura-visual" class="aura-circle">
                <div class="aura-content">
                    <h2 id="aura-text-percent">0%</h2>
                    <span id="aura-status-label">Aura Inicial</span>
                </div>
            </div>
        </div>

        <!-- SEÇÃO DE INPUTS / INTERAÇÃO -->
        <div id="input-group" class="input-group">
            <p class="instruction">Cole o código de aura de um amigo para absorver:</p>
            <div class="input-row">
                <input type="text" id="friend-code-input" placeholder="AURA-XXXXXX-XXX" autocomplete="off">
                <button id="btn-match">ABSORVER</button>
            </div>
        </div>

        <!-- RODAPÉ E BOTÕES DE COMPARTILHAMENTO -->
        <footer>
            <div class="share-zone">
                <button id="share-app-btn" class="btn-secondary">📢 Convidar Amigos (WhatsApp)</button>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
    <script>
        // Registro do Service Worker para o app funcionar offline (PWA)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(err => console.log("Erro SW:", err));
        }
    </script>
</body>
</html>
